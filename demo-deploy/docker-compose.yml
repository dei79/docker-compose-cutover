name: bluegreen-demo

x-app: &app
  pull_policy: never
  restart: unless-stopped
  networks: [demo]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 2s

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the directory: atomic file replacement remains visible inside Docker.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [demo]

  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-bluegreen-demo}:${BLUE_VERSION:-1.0.0}
    environment:
      SLOT: blue

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-bluegreen-demo}:${GREEN_VERSION:-1.0.0}
    environment:
      SLOT: green

networks:
  demo:
    driver: bridge
