name: Publish demo app

# Keeps ghcr.io/<owner>/docker-compose-cutover-demo:1.0.0 and :2.0.0 in sync
# with demo-app/ - both tags always contain the current app code, just built
# with a different VERSION build-arg (that's the whole point: it lets anyone
# try `docker cutover` against a real registry image without building
# locally, per README's "Try the included demo").
on:
  push:
    branches: [main]
    paths:
      - "demo-app/**"
      - ".github/workflows/publish-demo-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.0.0", "2.0.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: demo-app
          build-args: VERSION=${{ matrix.version }}
          tags: ghcr.io/${{ github.repository_owner }}/docker-compose-cutover-demo:${{ matrix.version }}
          push: true
