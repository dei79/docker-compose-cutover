name: Release

# Fires only when a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # to create the GitHub Release and upload its asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the plugin's own version metadata
        run: |
          sed -i "s/\"Version\": \"[^\"]*\"/\"Version\": \"${{ steps.version.outputs.value }}\"/" \
            cli-plugins/bgswitch/cli.py

      - name: Build .deb
        run: packaging/deb/build.sh "${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: docker-compose-cutover ${{ github.ref_name }}
          files: dist/*.deb
          generate_release_notes: true
